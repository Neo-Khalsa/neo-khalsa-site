<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=contain: iOS 26 Safari renders pages edge-to-edge under the
         status bar by default, but clips pinned headers to below it - so page
         content shows above the nav bar with no way to cover it. contain keeps
         the page out of that strip entirely; color-scheme/theme-color make
         Safari paint the strip dark to match the site. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=contain" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Neo Khalsa is building Sikh institutions: a book, a publishing imprint, an animated series, and in time an akhara, a university, and a gurdwara." />
    <meta property="og:site_name" content="Neo Khalsa" />
    <meta property="og:title" content="Neo Khalsa" />
    <meta property="og:description" content="A book, an imprint, an animated series, and in time an akhara, a university, and a gurdwara. The full plan, with costs and timelines, is published." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neokhalsa.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Neo Khalsa" />
    <meta name="twitter:description" content="A book, an imprint, an animated series, and in time an akhara, a university, and a gurdwara. The full plan, with costs and timelines, is published." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The mark is white on transparent, so every icon has the site's own
         near-black baked in: Google composites favicons onto a white result
         card, where a white-on-transparent mark simply vanishes. The .ico
         carries a 48px entry because that is the size Google renders at;
         16 and 32 alone were being upscaled, which is what made it blurry. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Neo Khalsa</title>
  </head>

  <body style="background:#0a0a0a">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
